services:
  currency-monitor:
    image: ghcr.io/cokolwiekpl/currency_monitor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config/alerts.json
      STATE_PATH: /data/state.json
      # Pass through only when defined, so an omitted value uses the image's file.
      ALERTS_CONFIG_JSON:
      DISCORD_WEBHOOK_PRIMARY: ${DISCORD_WEBHOOK_PRIMARY:-}
      DISCORD_WEBHOOK_SECONDARY: ${DISCORD_WEBHOOK_SECONDARY:-}
      BANK_API_TOKEN: ${BANK_API_TOKEN:-}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3600}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
    volumes:
      - monitor-state:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  monitor-state:
