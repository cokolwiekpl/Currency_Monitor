name: Test and publish image

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: currency-monitor:ci
      - name: Check container permissions and persistent state across recreation
        run: |
          docker volume create currency-monitor-ci-state
          trap 'docker volume rm currency-monitor-ci-state' EXIT
          for attempt in 1 2; do
            printf 'Checking container recreation %s\n' "$attempt"
            docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges \
              --mount type=volume,source=currency-monitor-ci-state,target=/data \
              currency-monitor:ci python - < tests/container_smoke.py
          done
      - name: Select publication target
        id: target
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        if: steps.target.outputs.publish == 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=Currency Monitor
            org.opencontainers.image.description=Currency threshold monitoring with Discord notifications
      - name: Log in to GHCR
        if: steps.target.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested source
        if: steps.target.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
